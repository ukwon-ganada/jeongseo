<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사건 정보</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--ink:#222;--ink2:#555;--muted:#8a8f98;--line:#ebedf0;--line2:#f2f3f5;
  --accent:#00c73c;--accent-ink:#00a83a;--accent-tint:#e8f9ee;
  --due:#ff6b00;--due-tint:#fff1e6;--danger:#f04452;
  --g-accept:#7c5cd6;--g-accept-t:#f1edfc;--g-hearing:#2f6fe4;--g-hearing-t:#e9f0fd;--g-ours:#00a83a;--g-ours-t:#e8f9ee;
  --g-meet:#0f9d9a;--g-meet-t:#e5f6f6;--g-msg:#d98a00;--g-msg-t:#fdf3e1;--g-chat:#8a8f98;--g-chat-t:#f2f3f5;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518;--surface:#1e1f23;--ink:#ececee;--ink2:#c2c5cb;--muted:#8b9099;--line:#2c2e33;--line2:#26282c;
  --accent:#16d158;--accent-ink:#3ddc78;--accent-tint:#173323;--due:#ff8a3d;--due-tint:#3a2614;--shadow:none;
  --g-accept:#a68cf0;--g-accept-t:#2a2440;--g-hearing:#6d9cf2;--g-hearing-t:#1c2840;--g-ours:#3ddc78;--g-ours-t:#173323;
  --g-meet:#3cc9c5;--g-meet-t:#163231;--g-msg:#f0b03c;--g-msg-t:#382a12;--g-chat:#8b9099;--g-chat-t:#26282c}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.2px;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}

/* 머리 */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.head{display:flex;align-items:flex-start;gap:12px;padding:14px 0 10px}
.head .txt{flex:1;min-width:0}
.head h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--line2);color:var(--muted)}
.btn-ghost{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 8px 11px;font-size:15px;color:var(--muted);position:relative;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--ink)}

/* 본문 */
main{max-width:880px;margin:0 auto;padding:12px 16px 32px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint);font-weight:600}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.empty-st{text-align:center;color:var(--muted);padding:56px 16px;font-size:14px}
.empty-st b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* 타임라인 */
.yr{font-size:13px;font-weight:700;color:var(--muted);padding:24px 16px 4px}
.ev{display:grid;grid-template-columns:52px 18px 1fr;gap:0 8px;padding:0 16px}
.ev .d{font-size:13px;color:var(--muted);padding:22px 0;text-align:right;font-variant-numeric:tabular-nums}
.ev .d small{display:block;font-size:11px}
.ev .rail{position:relative}
.ev .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.ev .rail::after{content:"";position:absolute;left:4px;top:27px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid #c4c8ce}
.ev.ours .rail::after{background:var(--accent);border-color:var(--accent)}
.ev.due .rail::after{border-color:var(--due);background:var(--due)}
.ev .t{padding:22px 0;border-bottom:1px solid var(--line2);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.ev:last-child .t{border-bottom:0}
.ev.ours .t{font-weight:700}
.ev.due .t{color:var(--due);font-weight:700}
.ev.court .t{color:var(--ink2)}
.ev.done .t{color:var(--ink)}
.ev.room .rail::after{border-color:var(--accent);background:var(--surface)}
.ev .src{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}
/* 종류별 색: 점과 앞머리 이름표 */
.ev{--gc:var(--g-chat);--gt:var(--g-chat-t)}
.ev.g-accept{--gc:var(--g-accept);--gt:var(--g-accept-t)}
.ev.g-hearing{--gc:var(--g-hearing);--gt:var(--g-hearing-t)}
.ev.g-ours{--gc:var(--g-ours);--gt:var(--g-ours-t)}
.ev.g-meet{--gc:var(--g-meet);--gt:var(--g-meet-t)}
.ev.g-msg{--gc:var(--g-msg);--gt:var(--g-msg-t)}
.ev[class*="g-"] .rail::after{background:var(--gc);border-color:var(--gc)}
.ev[class*="g-"].due .rail::after{background:var(--surface);border-color:var(--gc)}
.ev .gt{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;margin-right:7px;vertical-align:1px;color:var(--gc);background:var(--gt)}
.ev .soon{display:inline-block;font-size:11px;font-weight:700;color:var(--due);margin-right:6px;vertical-align:1px}

/* 목록 줄 */
.li{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line2);align-items:flex-start}
.card-h+.li,.li:first-child{border-top:0}
.li .main{flex:1;min-width:0;overflow-wrap:anywhere}
.li .t{font-size:15px}
.li .s{font-size:13px;color:var(--muted);margin-top:2px}
.li .tm{flex:none;width:52px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.li.past{opacity:.5}
.casechip{display:inline-block;font-size:12px;color:var(--accent-ink);background:var(--accent-tint);border-radius:4px;padding:0 6px;margin-right:6px}
.dday{flex:none;font-size:12px;font-weight:700;color:var(--due);background:var(--due-tint);border-radius:6px;padding:2px 8px}
.dday.past{color:var(--muted);background:var(--line2)}

/* 진행내용 */
.pg{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:12px 16px;border-top:1px solid var(--line2);font-size:14px}
.pg:first-child{border-top:0}
.pg .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pg .c{overflow-wrap:anywhere}
.pg .r{font-size:13px;color:var(--muted)}
.pg.hl .c{font-weight:700}
.pg.hl{box-shadow:inset 3px 0 0 var(--accent)}
.pg.dim{opacity:.45}
.pg.plan .d{color:var(--due);font-weight:600}
.fa{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.fa .fn{font-size:13px;color:var(--muted);overflow-wrap:anywhere;flex:1;min-width:0}
.fa .open{flex:none;border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-tint);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600}
.fa .open[disabled]{opacity:.5}
.picks{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.picks .s{font-size:12px;color:var(--muted)}
.pickf{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink)}
.pickf span{font-size:12px;color:var(--muted)}
.pickf.on{border-color:var(--accent);background:var(--accent-tint)}
.meta{font-size:12px;color:var(--muted);padding:0 2px 10px}

/* 사건 정보 */
.fr{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);min-height:48px}
.card-h+.fr{border-top:0}
.fr .l{font-size:14px;color:var(--muted)}
.fr .v{font-size:15px;overflow-wrap:anywhere;min-width:0}
.fr .v.none{color:#c4c8ce}
.fr.big .v{font-size:17px;font-weight:700}
.call{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:6px 12px}
.call svg{width:14px;height:14px}
.fr input,.fr textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);font-size:15px;outline:none}
.fr textarea{min-height:84px;resize:vertical}
.fr input:focus,.fr textarea:focus{border-color:var(--accent)}
/* 추가 전화(가족 등) */
.xp-in{display:grid;grid-template-columns:96px 1fr auto;gap:6px;align-items:center}
.xp-in input{min-width:0}
.xp-del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 4px}
.xp-add{display:block;width:calc(100% - 32px);margin:4px 16px 12px;border:1px dashed var(--line);border-radius:8px;background:none;padding:9px;font-size:14px;color:var(--accent-ink);font-weight:600}
.fr.memo{align-items:start}
.link-btn{border:0;background:none;color:var(--accent-ink);font-size:14px;font-weight:600;padding:4px 0}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar button{flex:1;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
.savebar .ok{background:var(--accent);color:#fff}
.savebar .no{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);padding:2px 4px 12px}

/* 고르기·로그인 */
.search{width:100%;border:0;border-radius:10px;padding:11px 14px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;margin-bottom:12px;outline:none}
.pick{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line2);background:none;padding:13px 16px}
.pick:first-child{border-top:0}
.pick .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.primary{border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;padding:13px 24px}
.setup ol{margin:0;padding:4px 16px 16px 36px}.setup li{padding:8px 0;font-size:15px}
.code{display:block;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--line2);border:0;border-radius:8px;padding:10px 12px;margin-top:6px;overflow-wrap:anywhere;user-select:all;text-align:left}
.copy{margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--accent-ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(34,34,34,.92);color:#fff;font-size:14px;border-radius:999px;padding:9px 18px;z-index:9}

/* PC: 넓은 화면 */
@media (min-width:900px){
  body{font-size:15px}
  .head{padding:22px 0 12px}
  .head h1{font-size:22px}
  main{padding-top:20px}
  .tabs{margin:0;padding:0}
  .tabs button{padding:12px 14px 13px}
  .tabs button[aria-current="page"]::after{left:14px;right:14px}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .info-grid .card{margin:0}
  .info-grid .wide{grid-column:1/-1}
  .li:hover,.pick:hover{background:var(--line2)}
}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="head">
      <div class="txt"><h1 id="title">사건 정보</h1><div class="sub" id="sub">불러오는 중…</div></div>
      <button class="btn-ghost" id="switch" hidden>사건 바꾸기</button>
    </div>
    <nav class="tabs" id="nav" aria-label="화면" hidden>
      <button data-v="timeline">타임라인</button>
      <button data-v="deadline">기한</button>
      <button data-v="hearing">기일</button>
      <button data-v="progress">나의사건</button>
      <button data-v="info">사건정보</button>
    </nav>
  </div>
</div>
<main id="main"></main>
<script>
// ── 설정 ──────────────────────────────────────────────
var WOFF_ID = 'Nxkob0LER_dfaSzH8s6flw';
var SDK = 'https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js';
var CASE_API = 'https://nyjyemjsperpakrrgzcc.supabase.co/functions/v1/case-view';

// ── 서버(case-view): 직원 확인 뒤에만 자료를 줌 ─────────
function api(body){
  return fetch(CASE_API, {method:'POST', headers:{'Content-Type':'application/json','X-Works-Token':ctx.tok||''}, body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){
      if(r.status===401) return relogin(j);
      if(!r.ok) throw new Error(j.error||('오류 '+r.status));
      try{ sessionStorage.removeItem('cv_relogin'); }catch(e){}
      return j;
    }); });
}
// 웍스 권한(OAuth Scopes)이 바뀌면 예전 로그인 토큰이 거절됨(401) → PC는 한 번 자동으로 다시 로그인, 휴대폰은 앱 재시작 안내
function relogin(j){
  var inClient=false; try{ inClient=woff.isInClient(); }catch(e){}
  var tried=false; try{ tried=!!sessionStorage.getItem('cv_relogin'); }catch(e){}
  if(!inClient && !tried){
    try{ sessionStorage.setItem('cv_relogin','1'); }catch(e){}
    try{ woff.logout(); }catch(e){}
    woff.login({redirectUri: location.href.replace(/[?&]relogin=1/,'')});
    return new Promise(function(){}); // 로그인 화면으로 넘어감
  }
  throw new Error(inClient ? '웍스 로그인이 만료됐습니다. 웍스 앱을 완전히 종료했다가 다시 열어 주세요.' : '웍스 로그인이 만료됐습니다. 이 창을 닫고 다시 열어 주세요.');
}
function loadCase(key){ return api({action:'case', room:key.room||'', 'case':key['case']||''}); }
function loadMyCases(){ return api({action:'mycases'}).then(function(j){ return j.cases||[]; }); }

// ── 공통 ──────────────────────────────────────────────
var $ = function(s){ return document.querySelector(s); };
var q = new URLSearchParams(location.search);
var view = q.get('view') || 'timeline';
var ctx = {room:'', caseParam:q.get('case')||'', tok:''};
var data = null, sub = {f:'all', scope:'case', p:'all'}, editing = false;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function md(d){ return Number(d.slice(5,7)) + '.' + d.slice(8,10); }
function dd(d){ return Math.round((Date.parse(d) - Date.parse(data.today)) / 864e5); }
function wk(d){ return '일월화수목금토'[new Date(d+'T00:00:00Z').getUTCDay()]; }
function chips(name, items){
  return '<div class="chips">'+items.map(function(it){ return '<button class="chip" data-'+name+'="'+it[0]+'" aria-pressed="'+(sub[name]===it[0])+'">'+it[1]+'</button>'; }).join('')+'</div>';
}
function emptySt(title, text){ return '<div class="empty-st"><b>'+title+'</b>'+(text||'')+'</div>'; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 1800); }
var PHONE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
function telHref(v){ var n=String(v||'').replace(/[^\d+]/g,''); return n.length>=7 ? 'tel:'+n : ''; }

// ── 화면별 그리기 ─────────────────────────────────────
var VIEWS = {
  timeline: function(){
    // 타임라인 = 우리가 한 일·해야 할 일, 걸러 보기 없이 한 줄로 (기한·기일은 메뉴가 따로 있음)
    var GLABEL={accept:'선임',hearing:'재판',ours:'제출',meet:'접견',msg:'문자',chat:'방 대화'};
    var list=data.events, h='';
    if(!list.length) return h+emptySt('표시할 내용이 없습니다');
    var body='', yr='';
    list.forEach(function(e){
      var y=e.d.slice(0,4); if(y!==yr){ yr=y; body+='<div class="yr">'+y+'</div>'; }
      var g=e.g||(e.src==='chat'?'chat':''), gl=GLABEL[g]||'';
      body+='<div class="ev '+e.k+(g?' g-'+g:'')+'"><div class="d">'+md(e.d)+'<small>'+wk(e.d)+'</small></div><div class="rail"></div><div class="t">'+(e.k==='due'?'<span class="soon">예정</span>':'')+(gl?'<span class="gt">'+gl+'</span>':'')+esc(e.t)+(e.cf?'<div class="fa"><button class="open" data-file="'+e.cf.id+'">계약서 열기</button><span class="fn">'+esc(e.cf.n)+'</span></div>':'')+finalFile(e)+'</div></div>';
    });
    return h+'<div class="card">'+body+'</div>';
  },
  deadline: function(){
    if(!data.deadlines.length) return emptySt('기한 계산 준비 중','새 기한 규칙이 완성되면 이곳에 표시됩니다.');
    var rows=data.deadlines.slice().sort(function(a,b){ return (a.st==='done')-(b.st==='done') || a.d.localeCompare(b.d); });
    return '<div class="card">'+rows.map(function(x){
      var n=dd(x.d), lab=x.st==='done'?'제출':n<0?'지남':n===0?'D-day':'D-'+n;
      return '<div class="li"><div class="main"><div class="t">'+esc(x.t)+'</div><div class="s">'+md(x.d)+'('+wk(x.d)+')까지 · '+esc(x.why)+'</div></div><span class="dday'+(x.st==='done'||n<0?' past':'')+'">'+lab+'</span></div>';
    }).join('')+'</div>';
  },
  hearing: function(){
    var all=sub.scope==='all';
    var pick=data.hearings.filter(function(x){ return all ? dd(x.d)>=0 && dd(x.d)<=28 : x.c===data.caseNo; });
    var up=pick.filter(function(x){return dd(x.d)>=0;}).sort(function(a,b){return (a.d+a.tm).localeCompare(b.d+b.tm);});
    var past=all?[]:pick.filter(function(x){return dd(x.d)<0;}).sort(function(a,b){return b.d.localeCompare(a.d);});
    var row=function(x, isPast){ return '<div class="li'+(isPast?' past':'')+'"><span class="tm">'+esc(x.tm||'')+'</span><div class="main"><div class="t">'+(all?'<span class="casechip">'+esc(x.c)+'</span>':'')+esc(x.t)+'</div>'+(x.p?'<div class="s">'+esc(x.p)+'</div>':'')+'</div></div>'; };
    var h=chips('scope', [['case','이 사건'],['all','내 사건 전체 · 4주']]), last='', card='';
    up.forEach(function(x){
      if(x.d!==last){ if(card) h+=card+'</div>'; last=x.d; var n=dd(x.d); card='<div class="card"><div class="card-h"><span style="color:var(--ink)">'+md(x.d)+' ('+wk(x.d)+')</span><span class="dday">'+(n===0?'오늘':'D-'+n)+'</span></div>'; }
      card+=row(x,false);
    });
    if(card) h+=card+'</div>';
    if(past.length) h+='<div class="card"><div class="card-h">지난 기일</div>'+past.map(function(x){ return row({tm:md(x.d), t:x.t, p:x.p}, true); }).join('')+'</div>';
    return (up.length||past.length) ? h : h+emptySt('기일이 없습니다');
  },
  progress: function(){
    var h=chips('p', [['all','전체'],['기일','기일'],['송달','송달'],['제출','제출']]);
    var rows=data.progress.rows.filter(function(x){ return sub.p==='all' || x.k===sub.p; }).slice().reverse();
    var pg=data.progress, ln=[];
    ln.push('로웨어 확인 '+esc(pg.checked||pg.updated)+(pg.checked?' (매일 아침 8시~밤 9시, 15분마다)':''));
    if(pg.changed) ln.push('이 사건 마지막 변경 '+esc(pg.changed));
    h+='<div class="meta">'+ln.join(' · ')+'</div>';
    if(!rows.length) return h+emptySt('최근 한 달 진행내용이 없습니다');
    return h+'<div class="card">'+rows.map(function(x){
      var cls=(x.o||x.u)?' hl':x.x?' dim':'';
      return '<div class="pg'+cls+(x.p?' plan':'')+'"><span class="d">'+x.d+'</span><div><div class="c">'+esc(x.c)+'</div>'+(x.r?'<div class="r">'+esc(x.r)+'</div>':'')+'</div></div>';
    }).join('')+'</div>';
  },
  info: function(){
    var f=data.info.fields;
    var field=function(key, label, opt){
      opt=opt||{};
      var v=f[key]||'';
      if(editing){
        var inp = opt.memo ? '<textarea data-k="'+key+'">'+esc(v)+'</textarea>' : '<input data-k="'+key+'" value="'+esc(v)+'"'+(opt.tel?' inputmode="tel"':'')+'>';
        return '<div class="fr'+(opt.memo?' memo':'')+'"><span class="l">'+label+'</span><div style="grid-column:2/4">'+inp+'</div></div>';
      }
      var tail = opt.tel && telHref(v) ? '<a class="call" href="'+telHref(v)+'">'+PHONE_SVG+'전화</a>' : '<span></span>';
      return '<div class="fr'+(opt.big?' big':'')+(opt.memo?' memo':'')+'"><span class="l">'+label+'</span><span class="v'+(v?'':' none')+'"'+(opt.memo?' style="white-space:pre-wrap"':'')+'>'+(v?esc(v):'—')+'</span>'+tail+'</div>';
    };
    // 추가 전화(가족 등, 석원 2026-11-13): [{n:'어머니', p:'010-…'}] 를 글자(JSON)로 저장
    var extraPhones=function(){
      var list=parseXp(f.extra_phones);
      if(editing) return '<div id="xp">'+list.map(xpRow).join('')+'</div><button class="xp-add" id="xp-add">+ 전화번호 추가 (가족 등)</button>';
      return list.map(function(x){
        var tail = telHref(x.p) ? '<a class="call" href="'+telHref(x.p)+'">'+PHONE_SVG+'전화</a>' : '<span></span>';
        return '<div class="fr"><span class="l">'+esc(x.n||'추가 전화')+'</span><span class="v">'+esc(x.p)+'</span>'+tail+'</div>';
      }).join('');
    };
    var ro=function(label, v, big){ return '<div class="fr'+(big?' big':'')+'"><span class="l">'+label+'</span><span class="v">'+esc(v)+'</span><span></span></div>'; };
    var head=function(t, btn){ return '<div class="card-h"><span>'+t+'</span>'+(btn&&!editing&&!data.roomOnly?'<button class="link-btn" id="edit">수정</button>':'')+'</div>'; };
    var h='<div class="info-grid">'+
      '<div class="card wide">'+head('기본 정보', true)+ro('사건번호', data.caseNo, true)+field('case_name','사건명')+field('client_name','의뢰인')+field('client_phone','전화번호',{tel:1})+extraPhones()+field('lawyer','담당변호사')+'</div>'+
      '<div class="card">'+head('재판부')+field('court_dept','법원·재판부')+field('court_phone','재판부 전화',{tel:1})+'</div>'+
      '<div class="card">'+head('수사')+field('investigator','수사기관·담당')+field('investigator_phone','수사관 전화',{tel:1})+'</div>'+
      '<div class="card wide">'+head('메모')+field('memo','메모',{memo:1})+'</div>'+
      (data.info.linked&&data.info.linked.length?'<div class="card wide">'+head('연결 사건')+data.info.linked.map(function(n){ return ro('사건번호', n); }).join('')+'</div>':'')+
      '</div>';
    if(editing) return h+'<div class="savebar"><button class="no" id="cancel">취소</button><button class="ok" id="save">저장</button></div>';
    var foot = data.info.saved ? '마지막 수정 '+esc(data.info.updatedBy||'')+' · '+esc(fmtTime(data.info.updatedAt)) : '처음 값은 로웨어에서 복사했습니다. 저장하면 이후 로웨어와 연동되지 않습니다.';
    return h+'<div class="foot">'+foot+'</div>';
  }
};
// 타임라인 "우리 서면" 줄: 그 제출의 최종본(그날 마지막으로 방에 올린 파일) [열기], 틀렸으면 [바꾸기]
function nearChoices(d){
  var t=Date.parse(d);
  return (data.fileChoices||[]).filter(function(f){ return Math.abs(Date.parse(f.d)-t)<=14*864e5; })
    .sort(function(a,b){ return (b.d+b.tm).localeCompare(a.d+a.tm); });
}
function finalFile(e){
  if(e.k!=='ours' || e.lp==null) return '';
  var near=nearChoices(e.d), h='';
  if(e.f) h='<div class="fa"><button class="open" data-file="'+e.f.id+'">열기</button><span class="fn">'+esc(e.f.n)+'</span>'+(near.length>1?'<button class="link-btn" data-pickfor="'+e.lp+'">바꾸기</button>':'')+'</div>';
  else if(near.length) h='<div class="fa"><button class="link-btn" data-pickfor="'+e.lp+'">제출본 파일 고르기</button></div>';
  if(String(sub.pick)===String(e.lp)){
    h+='<div class="picks"><div class="s">이 제출의 최종본을 고르세요</div>'+near.map(function(f){
      return '<button class="pickf'+(e.f&&e.f.id===f.id?' on':'')+'" data-setfile="'+f.id+'" data-lp="'+e.lp+'"><b>'+esc(f.n)+'</b><span>'+esc(f.d.replace(/-/g,'.')+' '+f.tm)+(f.by?' · '+esc(f.by):'')+'</span></button>';
    }).join('')+'<button class="link-btn" data-pickfor="">취소</button></div>';
  }
  return h;
}
function setFile(btn){
  btn.disabled=true;
  api({action:'set_file', lNum:data.lNum, lp:Number(btn.dataset.lp), id:Number(btn.dataset.setfile)}).then(function(){
    sub.pick=''; return loadCase(ctx.key).then(function(d){ data=d; render(); toast('바꿨습니다'); });
  }).catch(function(e){ btn.disabled=false; toast('바꾸지 못했습니다: '+((e&&e.message)||e)); });
}
// 파일 열기: 서버가 5분짜리 열람 주소를 줌 → 휴대폰은 바깥 브라우저, PC는 새 탭
function openFile(btn){
  var inClient=false; try{ inClient=woff.isInClient(); }catch(e){}
  var w = inClient ? null : window.open('', '_blank'); // PC: 팝업 차단을 피하려고 먼저 빈 탭을 엶
  btn.disabled=true; btn.textContent='여는 중…';
  api({action:'file_open', id:Number(btn.dataset.file)}).then(function(j){
    if(w){ w.location.href=j.url; }
    else if(inClient && woff.openWindow){ woff.openWindow({url:j.url, external:true}); }
    else location.href=j.url;
  }).catch(function(e){ if(w) w.close(); toast('열지 못했습니다: '+((e&&e.message)||e)); })
    .then(function(){ btn.disabled=false; btn.textContent='열기'; });
}
function fmtTime(t){ if(!t) return ''; var d=new Date(Date.parse(t)+9*3600e3).toISOString(); return md(d.slice(0,10))+' '+d.slice(11,16); }

function render(){
  document.querySelectorAll('#nav button').forEach(function(b){ b.setAttribute('aria-current', b.dataset.v===view?'page':'false'); });
  $('#nav').hidden=false;
  $('#title').textContent = data.roomOnly ? '수사 단계' : data.caseNo;
  $('#sub').innerHTML = (q.get('closed') || data.closed ? '<span class="tag">종결</span>' : '') + esc(data.title) + ' · ' + esc(data.court);
  $('#switch').hidden = !!ctx.room;
  $('#main').innerHTML = (VIEWS[view]||VIEWS.timeline)();
}
document.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.v){ if(editing && !confirmLeave()) return; editing=false; view=b.dataset.v; render(); window.scrollTo(0,0); return; }
  ['f','scope','p'].forEach(function(k){ if(b.dataset[k]){ sub[k]=b.dataset[k]; render(); } });
  if(b.id==='edit'){ editing=true; render(); var i=$('#main input'); if(i) i.focus(); }
  if(b.id==='cancel'){ editing=false; render(); }
  if(b.id==='save') saveInfo(b);
  if(b.dataset.file) openFile(b);
  if(b.dataset.pickfor!==undefined){ sub.pick=b.dataset.pickfor; render(); }
  if(b.dataset.setfile) setFile(b);
});
function parseXp(t){ try{ var a=JSON.parse(t||'[]'); return Array.isArray(a)?a.filter(function(x){ return x&&(x.p||x.n); }):[]; }catch(e){ return []; } }
function xpRow(x){ x=x||{}; return '<div class="fr xp"><div class="xp-in" style="grid-column:1/4"><input class="xp-n" placeholder="관계" value="'+esc(x.n||'')+'"><input class="xp-p" inputmode="tel" placeholder="전화번호" value="'+esc(x.p||'')+'"><button class="xp-del" type="button">삭제</button></div></div>'; }
document.addEventListener('click', function(e){
  if(e.target.id==='xp-add'){ var box=$('#xp'); if(box){ box.insertAdjacentHTML('beforeend', xpRow()); var ins=box.querySelectorAll('.xp-n'); ins[ins.length-1].focus(); } }
  if(e.target.classList.contains('xp-del')){ var r=e.target.closest('.xp'); if(r) r.remove(); }
});
function confirmLeave(){ return window.confirm('저장하지 않은 수정이 있습니다. 나갈까요?'); }
function saveInfo(btn){
  var fields={}; document.querySelectorAll('#main [data-k]').forEach(function(el){ fields[el.dataset.k]=el.value.trim(); });
  var xp=[]; document.querySelectorAll('#main .xp').forEach(function(r){ var n=r.querySelector('.xp-n').value.trim(), p=r.querySelector('.xp-p').value.trim(); if(n||p) xp.push({n:n,p:p}); });
  fields.extra_phones = xp.length ? JSON.stringify(xp) : '';
  btn.disabled=true; btn.textContent='저장 중…';
  api({action:'save_info', lNum:data.lNum, fields:fields}).then(function(j){
    data.info={fields:j.fields, saved:true, updatedBy:j.updatedBy, updatedAt:j.updatedAt, linked:data.info.linked};
    editing=false; render(); toast('저장했습니다');
  }).catch(function(e){ btn.disabled=false; btn.textContent='저장'; toast('저장 실패: '+((e&&e.message)||e)); });
}

// 최근 고른 사건 5개 (이 브라우저에만 저장)
function getRecent(){ try{ return JSON.parse(localStorage.getItem('jeongseo.recentCases')||'[]'); }catch(e){ return []; } }
function addRecent(c){ try{ var r=getRecent().filter(function(x){return x!==c;}); r.unshift(c); localStorage.setItem('jeongseo.recentCases', JSON.stringify(r.slice(0,5))); }catch(e){} }

// ── 사건 고르기 ───────────────────────────────────────
function showPicker(subText){
  $('#nav').hidden=true; $('#switch').hidden=true;
  $('#title').textContent='사건 고르기';
  $('#sub').textContent=subText||'내 담당 사건';
  $('#main').innerHTML='<input class="search" id="qs" placeholder="사건번호나 사건명으로 찾기"><div class="card" id="list"><div class="empty-st">불러오는 중…</div></div>';
  return loadMyCases().then(function(list){
    var recent=getRecent();
    function draw(qs){
      var rows=list.filter(function(x){ return !qs || (x.c+x.t).indexOf(qs)>=0; });
      if(!qs) rows.sort(function(a,b){ var i=recent.indexOf(a.c), j=recent.indexOf(b.c); return (i<0?99:i)-(j<0?99:j); });
      $('#list').innerHTML=rows.map(function(x){
        return '<button class="pick" data-case="'+esc(x.c)+'"><span class="casechip">'+esc(x.c)+'</span>'+esc(x.t)+'<span class="s">'+esc(x.next)+'</span></button>';
      }).join('') || emptySt('맞는 사건이 없습니다');
    }
    $('#qs').oninput=function(){ draw(this.value.trim()); };
    draw('');
  }).catch(function(e){ $('#list').innerHTML=emptySt('불러오지 못했습니다', esc((e&&e.message)||e)); });
}
document.addEventListener('click', function(e){
  if(e.target.id==='switch'){ showPicker(); window.scrollTo(0,0); return; }
  var b=e.target.closest('.pick'); if(!b) return;
  ctx.caseParam=b.dataset.case; addRecent(ctx.caseParam); editing=false;
  // 연결 안 된 방에서 고르면 그 방에 기억해 두고(다음부터 바로 열림) 방 기준으로 연다
  if(ctx.unpairedRoom){
    var room=ctx.unpairedRoom; ctx.unpairedRoom='';
    $('#sub').textContent='이 방에 연결하는 중…';
    return api({action:'link_room', room:room, 'case':ctx.caseParam})
      .then(function(r){ if(r.linked) toast('이 방에 사건을 연결했습니다'); return showCase(r.linked ? {room:room} : {'case':ctx.caseParam}); }, function(){ return showCase({'case':ctx.caseParam}); })
      .then(function(){ window.scrollTo(0,0); });
  }
  showCase({'case':ctx.caseParam}).then(function(){ window.scrollTo(0,0); });
});

// ── 사건 하나 열기 ────────────────────────────────────
function message(title, subText, body){
  $('#nav').hidden=true; $('#switch').hidden=true;
  $('#title').textContent=title; $('#sub').textContent=subText||'';
  $('#main').innerHTML=body||'';
}
function showHold(){ message('사건 미확정','', emptySt('이 방의 사건이 아직 정해지지 않았습니다')); }
function showCase(key){
  ctx.key=key;
  $('#sub').textContent='불러오는 중…';
  return loadCase(key).then(function(d){
    if(d.hold) return showHold();
    if(d.unpaired){ ctx.unpairedRoom=key.room||''; return showPicker('이 방과 연결된 사건이 없습니다 · 고르면 이 방에 기억됩니다'); }
    if(d.notfound) return message('사건을 찾지 못함', d.caseNo||'', emptySt('로웨어에 없는 사건번호입니다'));
    data=d; render();
  }).catch(function(e){
    message('불러오지 못함', '', emptySt('잠시 뒤 다시 열어 주세요', esc((e&&e.message)||e)));
  });
}

// ── PC: 지금 보고 있는 웍스 방 찾기 ───────────────────
function showLocate(){
  message('사건 정보', '보고 있는 웍스 방을 확인하는 중…', '<div class="empty-st">잠시만 기다려 주세요</div>');
  return api({action:'locate'}).then(function(j){
    if(j.room){ ctx.room=j.room; return showCase({room:j.room}); }
    if(j['case']){ ctx.caseParam=j['case']; return showCase({'case':j['case']}); }
    if(j.nohelper) return showPicker('PC 도우미가 켜져 있지 않아 방을 알 수 없습니다');
    if(j.timeout) return showPicker('PC 도우미가 응답하지 않습니다 (업데이트가 필요할 수 있어요)');
    return showPicker('웍스 창에서 방 이름을 읽지 못했습니다 (창을 최소화하지 마세요)');
  }).catch(function(){ return showPicker(''); });
}

// ── PC 도우미 연결 (?setup=pc) ────────────────────────
var GET_CMD = 'mkdir %TEMP%\\jshelper & cd /d %TEMP%\\jshelper & (for %f in (jeongseo-helper.ps1 install.ps1 install.cmd uninstall.ps1 uninstall.cmd server.json) do @curl -sSLO https://raw.githubusercontent.com/ukwon-ganada/jeongseo/main/tools/pc-helper/%f) & install.cmd';

function copyText(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('복사했습니다'); }).catch(function(){ toast('글자를 길게 눌러 직접 복사해 주세요'); }); }
document.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;

  if(b.id==='mktok'){
    b.disabled=true; b.textContent='만드는 중…';
    api({action:'helper_token'}).then(function(j){
      $('#tokbox').innerHTML='<button class="code" id="tok">'+esc(j.token)+'</button><button class="copy" data-copy="tok">코드 복사</button>';

  }
});

// ── WOFF 시작 ─────────────────────────────────────────
function start(){
  woff.init({woffId: WOFF_ID}).then(function(){
    // ?relogin=1: 권한이 바뀌었을 때 새 토큰을 받도록 로그아웃 후 다시 로그인
    if(q.get('relogin') && woff.isLoggedIn()){ try{ woff.logout(); }catch(e){} }
    if(!woff.isLoggedIn()){
      message('사건 정보','', '<div class="empty-st"><b>웍스 계정으로 로그인해 주세요</b><div style="margin-top:16px"><button class="primary" id="lg">로그인</button></div></div>');
      $('#lg').onclick=function(){ woff.login({redirectUri: location.href.replace(/[?&]relogin=1/,'')}); };
      return;
    }
    try{ ctx.tok = woff.getAccessToken ? woff.getAccessToken() : ''; }catch(e){}
    var inClient = woff.isInClient();
    var pRoom = inClient && woff.getChannelId ? Promise.resolve().then(function(){ return woff.getChannelId(); }).then(function(c){ ctx.room = c || ''; }).catch(function(){}) : Promise.resolve();
    return pRoom.then(function(){
      // 보류 방: 어느 사건인지 확정 못 함 → 사건정보·서면을 띄우지 않는다
      if(q.get('hold')) return showHold();
      if(q.get('setup')==='pc') return showSetup();
      // PC(바깥 브라우저): 웍스가 방을 알려 주지 않으므로, 이 PC 도우미가 웍스 창의 방 제목을 읽어 찾는다
      if(!inClient && !ctx.room && !ctx.caseParam && !q.get('room')) return showLocate();
      if(!ctx.room && !ctx.caseParam) return showPicker(q.get('room') ? '이 방과 연결된 사건이 없습니다' : '');
      return showCase(ctx.room ? {room:ctx.room} : {'case':ctx.caseParam});
    });
  }).catch(function(e){
