<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사건 정보</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--ink:#222;--ink2:#555;--muted:#8a8f98;--line:#ebedf0;--line2:#f2f3f5;
  --accent:#00c73c;--accent-ink:#00a83a;--accent-tint:#e8f9ee;
  --due:#ff6b00;--due-tint:#fff1e6;--danger:#f04452;
  --g-accept:#7c5cd6;--g-accept-t:#f1edfc;--g-hearing:#2f6fe4;--g-hearing-t:#e9f0fd;--g-ours:#00a83a;--g-ours-t:#e8f9ee;
  --g-meet:#0f9d9a;--g-meet-t:#e5f6f6;--g-msg:#d98a00;--g-msg-t:#fdf3e1;--g-chat:#8a8f98;--g-chat-t:#f2f3f5;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518;--surface:#1e1f23;--ink:#ececee;--ink2:#c2c5cb;--muted:#8b9099;--line:#2c2e33;--line2:#26282c;
  --accent:#16d158;--accent-ink:#3ddc78;--accent-tint:#173323;--due:#ff8a3d;--due-tint:#3a2614;--shadow:none;
  --g-accept:#a68cf0;--g-accept-t:#2a2440;--g-hearing:#6d9cf2;--g-hearing-t:#1c2840;--g-ours:#3ddc78;--g-ours-t:#173323;
  --g-meet:#3cc9c5;--g-meet-t:#163231;--g-msg:#f0b03c;--g-msg-t:#382a12;--g-chat:#8b9099;--g-chat-t:#26282c}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.2px;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}

/* 머리 */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.head{display:flex;align-items:flex-start;gap:12px;padding:14px 0 10px}
.head .txt{flex:1;min-width:0}
.head h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;background:var(--line2);color:var(--muted)}
.btn-ghost{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 8px 11px;font-size:15px;color:var(--muted);position:relative;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--ink)}
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctabs button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.ctabs button i{font-style:normal;font-size:11px;font-weight:700;margin-right:5px;padding:1px 5px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.ctabs button[aria-current="true"] i{background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface)}
.ctabs .lk{flex:none;align-self:center;color:var(--muted);font-size:12px;margin:0 -2px}
.ctabs .gl{flex:none;align-self:center;font-size:11px;font-weight:800;color:var(--g-hearing);margin:0 2px 0 4px}
.ctabs .gl:first-child{margin-left:0}
.ctabs .sep{flex:none;width:1px;background:var(--line);margin:4px 6px}
/* 심급 띠(타임라인): 지난 심급 회색, 지금 심급 파랑 */
.stg-band{display:grid;grid-template-columns:44px 20px 1fr;gap:0 10px;padding:16px 20px 8px;align-items:center}
.stg-band b{font-size:13px;font-weight:800;color:var(--g-hearing);text-align:right}
.stg-band .rail{position:relative;height:20px}
.stg-band .rail::after{content:"";position:absolute;left:2px;top:3px;width:14px;height:14px;border-radius:4px;background:var(--g-hearing)}
.stg-band .lab{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.stg-band .lab span{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--g-hearing-t);color:var(--g-hearing)}
.stg-band .lab span i{font-style:normal;font-size:10px;margin-right:4px;opacity:.8}
.stg-band .lab::after{content:"";flex:1;min-width:20px;height:2px;background:linear-gradient(90deg,var(--g-hearing),transparent);opacity:.35}
.stg-band.old b,.stg-band.old .lab span{color:var(--muted)}
.stg-band.old .rail::after{background:var(--line)}
.stg-band.old .lab span{background:var(--line2)}
.stg-band.old .lab::after{background:linear-gradient(90deg,var(--line),transparent)}
/* 나의사건 심급 칸 */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 10px;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 8px;font-size:13px;color:var(--muted);text-align:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button b{display:block;font-size:14px;color:var(--ink2)}
.seg button[aria-current="true"]{background:var(--g-hearing-t)}
.seg button[aria-current="true"] b{color:var(--g-hearing)}
.ctag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-right:5px;background:var(--line2);color:var(--ink2);vertical-align:1px}

/* 본문 */
main{max-width:880px;margin:0 auto;padding:12px 16px 32px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint);font-weight:600}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.hbtns{flex:none;display:flex;gap:6px}.hbtns label.btn-ghost{cursor:pointer}
.imp-b{padding:12px 16px 16px}.imp-b .s{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.tled{padding:4px 16px 14px}.tle-h .s{font-size:13px;color:var(--muted);padding:12px 0}
.tle{display:grid;grid-template-columns:132px 58px 1fr auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.tled .tle:first-child{border-top:0}
.tle input{min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;background:var(--surface);color:var(--ink)}
.tle.off input{opacity:.45;text-decoration:line-through}
.tle-a{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:12px}.tle-a .sp{flex:1}.tle-a button{white-space:nowrap}
@media (max-width:520px){.tle-a .sp{flex-basis:100%;height:0}.tle-a #tlcancel{margin-left:auto}}
.tle-a .open{border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-tint);border-radius:8px;padding:7px 16px;font-size:14px;font-weight:600}
@media (max-width:520px){.tle{grid-template-columns:1fr 64px auto}.tle .tle-t{grid-column:1/3}}
.imp-r{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.imp-r input{margin-top:3px;flex:none}.imp-r .d{flex:none;width:76px;color:var(--ink2);font-variant-numeric:tabular-nums}.imp-r small{color:var(--muted)}
.imp-a{display:flex;gap:10px;align-items:center;margin-top:12px}
.imp-a .open{border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-tint);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600}
.imp-a .open:disabled{opacity:.5}
.empty-st{text-align:center;color:var(--muted);padding:56px 16px;font-size:14px}
.empty-st b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* 타임라인 (2026-11-13 다듬음): 꼬리표·구분선 없이 점 색으로만 구분, 제목 + 회색 보조줄 */
.tl{max-width:680px;margin:0 0 12px;padding:6px 0 14px}
.yr{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px;padding:18px 20px 4px}
.ev{display:grid;grid-template-columns:44px 20px 1fr;gap:0 10px;padding:0 20px}
.ev .d{padding:9px 0;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25}
.ev .d b{display:block;font-size:13px;font-weight:600;color:var(--ink2)}
.ev .d small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.ev .rail{position:relative}
.ev .rail::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line2)}
.ev .rail::after{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--gc);border:2px solid var(--gc);box-shadow:0 0 0 3px var(--surface)}
.ev.due .rail::after{background:var(--surface)}
.ev .t{padding:9px 0;min-width:0}
.ev .tt{font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.ev .ts{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45;overflow-wrap:anywhere}
.ev .pill{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:999px;margin-left:6px;vertical-align:2px;background:var(--line2);color:var(--ink2)}
.ev.due .tt{color:var(--ink)}
/* 종류별 점 색 (꼬리표 없이) */
.ev{--gc:#c4c8ce}
.ev.g-accept{--gc:var(--ink)}
.ev.g-hearing{--gc:var(--g-hearing)}
.ev.g-ours{--gc:var(--g-ours)}
.ev.g-meet{--gc:var(--g-meet)}
/* 핵심 줄(조사·송치·기소): 글자 크게·굵게, 점 크게, 옅은 바탕 */
.ev.key .t{padding:11px 0}
.ev.key .tt{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ev.key .d b{font-size:14px;font-weight:700;color:var(--ink)}
.ev.key .rail::after{left:2px;top:13px;width:12px;height:12px}
.ev.key .t{background:linear-gradient(90deg,color-mix(in srgb,var(--gc) 9%,transparent),transparent 85%);border-radius:8px;padding-left:8px;margin-left:-8px}
/* 덜 중요한 줄(문자·방 대화): 한 줄, 작고 흐리게 */
.ev.minor .d{padding:4px 0}
.ev.minor .d b{font-size:12px;font-weight:400;color:var(--muted)}
.ev.minor .d small{display:none}
.ev.minor .t{padding:4px 0}
.ev.minor .tt{font-size:13px;font-weight:400;color:var(--muted)}
.ev.minor .rail::after{left:6px;top:9px;width:4px;height:4px;border-width:1px;background:#c4c8ce;border-color:#c4c8ce}
/* 열리지 않은 기일(변경·연기): 빈 회색 점, 흐린 취소선 */
.ev.moved{--gc:#c4c8ce}
.ev.moved .rail::after{background:var(--surface)}
.ev.moved .tt{color:var(--muted);font-weight:500;text-decoration:line-through;text-decoration-color:var(--muted)}
.ev.moved .pill,.li .mv{background:var(--line2);color:var(--ink2);text-decoration:none}
.li .mv{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.li.moved .t>span.x{text-decoration:line-through;color:var(--muted)}
/* 법정기한(잠정): 빨간 점 + 남은 날 */
.ev.g-limit{--gc:var(--danger)}
.ev.g-limit.due .tt{color:var(--danger)}
.ev.g-limit .pill{background:var(--danger);color:#fff}
.ev.g-limit.done .tt{color:var(--muted);font-weight:500}
.ev.g-limit.done .pill{background:var(--line2);color:var(--muted)}
/* 오늘 */
.today{display:grid;grid-template-columns:44px 20px 1fr;gap:0 10px;padding:4px 20px;align-items:center}
.today b{font-size:11px;font-weight:700;color:var(--accent-ink);text-align:right}
.today .rail{position:relative;height:14px}
.today .rail::after{content:"";position:absolute;left:3px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.today i{height:1px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.5}
.dlc{display:grid;grid-template-columns:64px 1fr auto;gap:0 16px;align-items:center;padding:16px 18px 16px 20px;position:relative}
.dlc+.dlc{border-top:1px solid var(--line2)}
.dlc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--uc)}
.dlc{--uc:var(--due)}
.dlc.hot{--uc:var(--danger)}
.dlc.off{--uc:var(--line)}
.dlc .dd{text-align:center;line-height:1.1}
.dlc .dd b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--uc)}
.dlc .dd small{font-size:12px;color:var(--muted)}
.dlc .dt{font-size:16px;font-weight:700}
.dlc .ds{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.dlc .tag{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:999px;margin-left:6px;vertical-align:2px;border:1px solid var(--uc);color:var(--uc)}
.dlc .dn{min-width:64px;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;background:var(--uc);border-radius:10px;padding:8px 10px}
.dlc.off .dd b,.dlc.off .dt{color:var(--muted)}
.dlc.off .dn{background:var(--line2);color:var(--muted);font-size:14px}
/* 실제 날짜 차이만큼 띄우기. 너무 길면 줄이고 '몇 개월' 표시 */
.gap{display:grid;grid-template-columns:44px 20px 1fr;gap:0 10px;padding:0 20px}
.gap .rail{position:relative}
.gap .rail::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line2)}
.gap.long .rail::before{background:none;border-left:2px dotted var(--line);width:0}
.gap .gl{align-self:center;font-size:11px;color:var(--muted)}

/* 목록 줄 */
.li{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line2);align-items:flex-start}
.card-h+.li,.li:first-child{border-top:0}
.li .main{flex:1;min-width:0;overflow-wrap:anywhere}
.li .t{font-size:15px}
.li .s{font-size:13px;color:var(--muted);margin-top:2px}
.li .tm{flex:none;width:52px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.li.past{opacity:.5}
.casechip{display:inline-block;font-size:12px;color:var(--accent-ink);background:var(--accent-tint);border-radius:4px;padding:0 6px;margin-right:6px}
.dday{flex:none;font-size:12px;font-weight:700;color:var(--due);background:var(--due-tint);border-radius:6px;padding:2px 8px}
.dday.past{color:var(--muted);background:var(--line2)}

/* 진행내용 */
.pg{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:12px 16px;border-top:1px solid var(--line2);font-size:14px}
.pg:first-child{border-top:0}
.pg .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pg .c{overflow-wrap:anywhere}
.pg .r{font-size:13px;color:var(--muted)}
.pg.hl .c{font-weight:700}
.pg.hl{box-shadow:inset 3px 0 0 var(--accent)}
.pg.dim{opacity:.45}
.pg.plan .d{color:var(--due);font-weight:600}
/* 파일 보기 창: 화면 전체, 왼쪽 위 ← 로 그대로 타임라인 */
.fv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.fv[hidden]{display:none}
html.fv-on,html.fv-on body{overflow:hidden}
.fv-bar{flex:none;display:flex;align-items:center;gap:6px;height:52px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.fv-btn{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink);border-radius:10px;cursor:pointer}
.fv-btn svg{width:22px;height:22px}
.fv-btn:hover{background:var(--line2)}
.fv-btn#fvext{color:var(--muted)}
.fv-btn#fvext svg{width:19px;height:19px}
.fv-name{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.fv-pages{max-width:900px;margin:0 auto;padding:12px 0 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fv-pages canvas{display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fv-load{padding:80px 0;display:flex;justify-content:center}
.fv-load span{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:fvspin .8s linear infinite}
@keyframes fvspin{to{transform:rotate(360deg)}}
/* 타임라인 파일: 제목 옆 작은 칩(파일 이름은 마우스를 올리면) */
.fchip{display:inline-flex;align-items:center;gap:3px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);border-radius:999px;padding:1px 7px 1px 6px;font-size:11px;font-weight:600;line-height:16px;cursor:pointer}
.fchip svg{width:11px;height:11px;flex:none}
.fchip:hover{border-color:var(--accent)}
.fchip[disabled]{opacity:.5}
/* 타임라인 [수정]: 제출 서면마다 붙일 파일 고르기 */
.tlf-h{font-size:12px;font-weight:600;color:var(--muted);padding:12px 0 4px}
.tlf{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.tlf .d{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tlf .t{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlf select{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--surface);color:var(--ink)}
@media (max-width:520px){.tlf{grid-template-columns:52px minmax(0,1fr)}.tlf select{grid-column:1/3}}
.meta{font-size:12px;color:var(--muted);padding:0 2px 10px}

/* 사건 정보 */
.fr{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);min-height:48px}
.card-h+.fr{border-top:0}
.fr .l{font-size:14px;color:var(--muted)}
.fr .v{font-size:15px;overflow-wrap:anywhere;min-width:0}
.fr .v.none{color:#c4c8ce}
.fr.big .v{font-size:17px;font-weight:700}
.call{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:6px 12px}
.call svg{width:14px;height:14px}
.fr input,.fr textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);font-size:15px;outline:none}
.fr textarea{min-height:84px;resize:vertical}
.fr input:focus,.fr textarea:focus{border-color:var(--accent)}
/* 추가 전화(가족 등) */
.xp-in{display:grid;grid-template-columns:96px 1fr auto;gap:6px;align-items:center}
.xp-in input{min-width:0}
.pv-in{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.pv-in input{min-width:0}
.pv-in .xp-del{grid-column:1/3;justify-self:end}
.fr.pvv .v{color:var(--muted);font-size:14px}
.xp-del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 4px}
.xp-add{display:block;width:calc(100% - 32px);margin:4px 16px 12px;border:1px dashed var(--line);border-radius:8px;background:none;padding:9px;font-size:14px;color:var(--accent-ink);font-weight:600}
.fr.memo{align-items:start}
.link-btn{border:0;background:none;color:var(--accent-ink);font-size:14px;font-weight:600;padding:4px 0}
.link-btn.warn{color:var(--danger);margin-left:14px}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar button{flex:1;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
.savebar .ok{background:var(--accent);color:#fff}
.savebar .no{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);padding:2px 4px 12px}
/* 사건정보 단계 칸 */
.cp{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;padding:4px 10px;color:var(--ink2)}
.hist{font-size:12px;color:var(--muted);padding:0 16px 12px 122px;margin-top:-6px;line-height:1.6;overflow-wrap:anywhere}
.hist s{color:#b0b4ba}
.hist.hl{margin-top:-8px}
.hist .more{border:0;background:none;padding:0 0 0 4px;font-size:12px;font-weight:600;color:var(--g-hearing)}
.stg{display:flex;gap:6px;flex-wrap:wrap;grid-column:2/4}
.stg span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--line2);color:var(--muted)}
.stg span.done{color:var(--ink2)}
.stg span.now{background:var(--g-hearing);color:#fff;font-weight:700}
.now-pill{font-size:11px;font-weight:700;color:#fff;background:var(--g-hearing);border-radius:999px;padding:3px 8px;margin-left:4px;vertical-align:1px}
.card.cur{}
.card.past .card-h{padding-bottom:14px}
.card.past:not(.editing) .card-h>span:first-child{color:var(--ink2)}
.card-h .sum{font-weight:400;color:var(--muted);margin-left:10px}
.card-h .hb{display:flex;align-items:center;gap:14px}
/* 칸마다 [수정]: 누른 칸만 입력칸으로 바뀌고, 그 칸 아래에 취소·저장 */
.info-col{max-width:720px}
.a-s>.card:last-child{margin-bottom:12px}
.info-col .card-h{padding:10px 16px 6px;min-height:50px;box-sizing:border-box}
.edit-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.edit-btn svg{width:13px;height:13px}
.edit-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.card.editing{box-shadow:0 0 0 2px var(--accent)}
.card.editing .card-h>span:first-child{color:var(--accent-ink)}
.cardbar{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line2)}
.cardbar button{border-radius:8px;padding:9px 18px;font-size:15px;font-weight:700}
.cardbar .ok{border:0;background:var(--accent);color:#fff}
.cardbar .no{border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
@media (max-width:520px){.cardbar button{flex:1}}
.fr select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);font-size:15px}
@media (max-width:520px){.hist{padding-left:16px}}

/* 고르기·로그인 */
.search{width:100%;border:0;border-radius:10px;padding:11px 14px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;margin-bottom:12px;outline:none}
.pick{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line2);background:none;padding:13px 16px}
.pick:first-child{border-top:0}
.pick .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.primary{border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;padding:13px 24px}
.setup ol{margin:0;padding:4px 16px 16px 36px}.setup li{padding:8px 0;font-size:15px}
.code{display:block;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--line2);border:0;border-radius:8px;padding:10px 12px;margin-top:6px;overflow-wrap:anywhere;user-select:all;text-align:left}
.copy{margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--accent-ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(34,34,34,.92);color:#fff;font-size:14px;border-radius:999px;padding:9px 18px;z-index:9}

/* PC: 넓은 화면 (사건정보는 좌우 배치) */
@media (min-width:900px){
  body{font-size:15px}
  .head{padding:22px 0 12px}
  .head h1{font-size:22px}
  main{padding-top:20px}
  .tabs{margin:0;padding:0}
  .tabs button{padding:12px 14px 13px}
  .tabs button[aria-current="page"]::after{left:14px;right:14px}
  .li:hover,.pick:hover{background:var(--line2)}
  .wrap,main{max-width:1240px;padding-left:32px;padding-right:32px}
  /* 사건정보: 왼쪽 기본 정보·메모, 오른쪽 단계 칸 */
  .info-col{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"b s" "m s" "k s" "f s";grid-template-rows:auto auto auto 1fr;column-gap:20px;align-items:start}
  .info-col>.a-b{grid-area:b}.info-col>.a-s{grid-area:s}.info-col>.a-m{grid-area:m}.info-col>.a-k{grid-area:k}.info-col>.foot{grid-area:f}
  .fr{grid-template-columns:110px 1fr auto}
  .hist{padding-left:136px}
}
</style>

    </nav>
  </div>
</div>
<main id="main"></main>
<script>
// ── 설정 ──────────────────────────────────────────────
var WOFF_ID = 'Nxkob0LER_dfaSzH8s6flw';
var SDK = 'https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js';
var CASE_API = 'https://nyjyemjsperpakrrgzcc.supabase.co/functions/v1/case-view';

// ── 서버(case-view): 직원 확인 뒤에만 자료를 줌 ─────────
function api(body){
  return fetch(CASE_API, {method:'POST', headers:{'Content-Type':'application/json','X-Works-Token':ctx.tok||''}, body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){
      if(r.status===401) return relogin(j);
      if(!r.ok) throw new Error(j.error||('오류 '+r.status));
      try{ sessionStorage.removeItem('cv_relogin'); }catch(e){}
      return j;
    }); });
}
// 웍스 권한(OAuth Scopes)이 바뀌면 예전 로그인 토큰이 거절됨(401) → PC는 한 번 자동으로 다시 로그인, 휴대폰은 앱 재시작 안내
function relogin(j){
  var inClient=false; try{ inClient=woff.isInClient(); }catch(e){}
  var tried=false; try{ tried=!!sessionStorage.getItem('cv_relogin'); }catch(e){}
  if(!inClient && !tried){
    try{ sessionStorage.setItem('cv_relogin','1'); }catch(e){}
    try{ woff.logout(); }catch(e){}
    woff.login({redirectUri: location.href.replace(/[?&]relogin=1/,'')});
    return new Promise(function(){}); // 로그인 화면으로 넘어감
  }
  throw new Error(inClient ? '웍스 로그인이 만료됐습니다. 웍스 앱을 완전히 종료했다가 다시 열어 주세요.' : '웍스 로그인이 만료됐습니다. 이 창을 닫고 다시 열어 주세요.');
}
function loadCase(key){ return api({action:'case', room:key.room||'', 'case':key['case']||''}); }
function loadMyCases(){ return api({action:'mycases'}).then(function(j){ return j.cases||[]; }); }

// ── 공통 ──────────────────────────────────────────────
var $ = function(s){ return document.querySelector(s); };
var q = new URLSearchParams(location.search);
var view = q.get('view') || 'timeline';
var ctx = {room:'', caseParam:q.get('case')||'', tok:''};
var data = null, sub = {f:'all', scope:'case', p:'all'}, editing = false;
// 사건정보 단계 칸 (석원 2026-11-16): 경찰·공소청·1심·2심·3심, 지난 단계는 접어 둠
var SK=['police','pros','c1','c2','c3'], SL={police:'경찰',pros:'공소청',c1:'1심',c2:'2심',c3:'3심'};
var SF={police:[['org','경찰서·팀'],['no','접수번호',{copy:1}],['person','수사관',{hist:1}],['phone','전화',{tel:1,hist:1}],['mobile','휴대전화',{tel:1}]],
  pros:[['org','공소청'],['no','형제번호',{copy:1}],['person','공소관',{hist:1}],['phone','전화',{tel:1,hist:1}],['mobile','휴대전화',{tel:1}]],
  court:[['org','법원'],['no','사건번호',{copy:1}],['dept','재판부',{hist:1}],['phone','재판부 전화',{tel:1,hist:1}]]};
var stOpen={};
function copyText(t){
  var done=function(){ toast('복사했습니다'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); }); }
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){ var a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(e){} a.remove(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var MOVED_RE=/기일변경|기일연기|연기|추정|취소/;
function cnk(c){ var m=String(c||'').replace(/\s/g,'').match(/^(\d{2}|\d{4})([가-힣]+)0*(\d+)$/); return m?m[1].slice(-2)+m[2]+m[3]:String(c||''); }
function md(d){ return Number(d.slice(5,7)) + '.' + d.slice(8,10); }
function dd(d){ return Math.round((Date.parse(d) - Date.parse(data.today)) / 864e5); }
function wk(d){ return '일월화수목금토'[new Date(d+'T00:00:00Z').getUTCDay()]; }
function chips(name, items){
  return '<div class="chips">'+items.map(function(it){ return '<button class="chip" data-'+name+'="'+it[0]+'" aria-pressed="'+(sub[name]===it[0])+'">'+it[1]+'</button>'; }).join('')+'</div>';
}
function emptySt(title, text){ return '<div class="empty-st"><b>'+title+'</b>'+(text||'')+'</div>'; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 1800); }
var PEN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
var PHONE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
function telHref(v){ var n=String(v||'').replace(/[^\d+]/g,''); return n.length>=7 ? 'tel:'+n : ''; }

// ── 화면별 그리기 ─────────────────────────────────────
var VIEWS = {
  timeline: function(){
    // 타임라인 = 우리가 한 일·해야 할 일, 걸러 보기 없이 한 줄로 (기한·기일은 메뉴가 따로 있음)
    // 줄 사이 간격 = 실제 날짜 차이(제곱근으로 눌러서). 45일 넘으면 점선 + '약 N개월'로 줄여 보여 줌
    var gapDiv=function(a,b){
      var days=Math.round((Date.parse(b)-Date.parse(a))/864e5); if(days<=0) return '';
      var long=days>=45, h=long?36:Math.round(Math.min(Math.sqrt(days)*7,44));
      var lab=long?(days>=60?'약 '+Math.round(days/30)+'개월':days+'일'):'';
      return '<div class="gap'+(long?' long':'')+'" style="height:'+h+'px"><span></span><span class="rail"></span><span class="gl">'+lab+'</span></div>';
    };
    // 제목과 보조줄 나누기: "공판기일(327호 법정 11:00) · 속행" → 공판기일 / 11:00 · 327호 법정 · 속행
    var split=function(e){
      var t=String(e.t||''), sub=[], m;
      if(e.g==='msg'||e.g==='chat') return {tt:t, ts:''};
      t=t.replace(/^출석\s+/,'');
      if((m=t.match(/^(\d{1,2}:\d{2})\s+(.*)$/))){ sub.push(m[1]); t=m[2]; }
      var parts=t.split(' · '); t=parts.shift();
      if((m=t.match(/^(.*?)\s*\(([^()]*)\)\s*$/))){
        t=m[1]; var inner=m[2], tm=inner.match(/\s*(\d{1,2}:\d{2})\s*$/);
        if(tm){ sub.push(tm[1]); inner=inner.slice(0,tm.index).trim(); }
        if(inner) sub.push(inner);
      }
      t=t.replace(/\s+예정$/,'');
      return {tt:t, ts:sub.concat(parts).join(' · ')};
    };
    if(tl.on) return tlEditView();
    var list=data.events, h=importCard();
    if(!list.length) return h+emptySt('표시할 내용이 없습니다');
    var body='', yr='', prevD='', prevY='', todayDone=false, today=data.today||'';
    var lvs=(data.levels&&data.levels.length>1)?data.levels:null, shownLv=-1, topLv=lvs?lvs[lvs.length-1].lv:0;
    var bandHtml=function(lv){ var L=lvs.filter(function(x){ return x.lv===lv; })[0]; if(!L) return '';
      return '<div class="stg-band'+(lv<topLv?' old':'')+'"><b>'+esc(L.label)+'</b><span class="rail"></span><div class="lab">'+L.cases.map(function(c){ return '<span>'+(L.merged.indexOf(c)>=0?'<i>병합</i>':'')+esc(c)+'</span>'; }).join('')+'</div></div>'; };
    list.forEach(function(e){
      var y=e.d.slice(0,4); if(y!==yr){ yr=y; body+='<div class="yr">'+y+'</div>'; }
      if(!todayDone && today && e.d>=today && prevD && prevD<today){ body+='<div class="today"><b>오늘</b><span class="rail"></span><i></i></div>'; todayDone=true; prevD=''; }
      var g=e.g||(e.src==='chat'?'chat':''), minor=(g==='msg'||g==='chat');
      // 송치·기소·조사(수사 단계 핵심 일): 글자를 키워 따로 강조 (2026-11-16 석원 요청)
      var key=!minor && g!=='limit' && /조사|송치|기소|처분/.test(e.t||'');
      if(prevD && y===prevY) body+=gapDiv(prevD, e.d);
      if(lvs && e.lv!=null && e.lv>shownLv){ shownLv=e.lv; body+=bandHtml(e.lv); }
      prevD=e.d; prevY=y;
      var p=split(e), pill='';
      if(g==='limit'){ var n=dd(e.d); pill='<span class="pill">'+(n<0?'지남':n===0?'오늘까지':'D-'+n)+'</span>'; p.ts=(p.ts?p.ts+' · ':'')+(e.src==='chat'?'대화 기준':'잠정'); }
      else if(e.k==='due') pill='<span class="pill">예정</span>';
      var moved=g==='hearing' && MOVED_RE.test(p.ts); if(moved){ pill='<span class="pill">'+(p.ts.match(MOVED_RE)[0])+'</span>'; p.ts=p.ts.replace(/\s*·\s*(기일변경|기일연기|연기|추정|취소)\s*$/,''); }
      body+='<div class="ev '+e.k+(g?' g-'+g:'')+(minor?' minor':'')+(key&&!moved?' key':'')+(moved?' moved':'')+'"><div class="d"><b>'+md(e.d)+'</b><small>'+wk(e.d)+'</small></div><div class="rail"></div><div class="t">'
        +'<div class="tt">'+esc(p.tt)+pill+(e.cf?fileChip(e.cf,'계약서'):'')+(e.f&&!e.minor?fileChip(e.f,'열기'):'')+'</div>'+(p.ts?'<div class="ts">'+esc(p.ts)+'</div>':'')+'</div></div>';
    });
    return h+'<div class="card tl">'+body+'</div>';
  },
  deadline: function(){
    if(!data.deadlines.length) return emptySt('계산된 기한이 없습니다','선고·기록접수통지, 또는 불기소·불송치·항고기각 줄이 들어오면 자동으로 표시됩니다.');
    var rows=data.deadlines.slice().sort(function(a,b){ return (a.st==='done')-(b.st==='done') || (a.d||'9').localeCompare(b.d||'9'); });
    return '<div class="card">'+rows.map(function(x){
      var why=String(x.why||''), tag='';
      var m=why.match(/^미확정(\([^)]*\))?\s*·?\s*/); if(m){ tag='<span class="tag">미확정</span>'; why=why.slice(m[0].length); }
      if(x.st==='expected') tag+='<span class="tag">선고되면</span>';
      if(!x.d) return '<div class="dlc off"><div class="dd"><b>—</b></div><div><div class="dt">'+esc(x.t)+tag+'</div><div class="ds">'+esc(why)+'</div></div><span class="dn">도달 전</span></div>';
      var n=dd(x.d), done=x.st==='done', off=done||n<0;
      var lab=done?'제출'+(x.doneOn?' '+md(x.doneOn):''):n<0?'지남':n===0?'D-day':'D-'+n;
      return '<div class="dlc'+(off?' off':n<=7?' hot':'')+'"><div class="dd"><b>'+md(x.d)+'</b><small>'+wk(x.d)+'요일</small></div><div><div class="dt">'+esc(x.t)+tag+'</div><div class="ds">'+esc(why)+'</div></div><span class="dn">'+lab+'</span></div>';
    }).join('')+'</div>';
  },
  hearing: function(){
    var all=sub.scope==='all';

      }).then(next, next);
    })();
  }).catch(function(e){
    if(run!==fv.run) return;
    // 보기 창에서 못 그리면 바깥에서 연다
    closeViewer();
    fileUrl(id).then(openExternal).catch(function(){ toast('열지 못했습니다: '+((e&&e.message)||e)); });
  });
}
function closeViewer(fromPop){

  fv.run++; fv.el.hidden=true; document.documentElement.classList.remove('fv-on');
  fv.el.querySelector('.fv-pages').innerHTML='';
  if(!fromPop){ try{ if(history.state && history.state.fv) history.back(); }catch(e){} }
}
window.addEventListener('popstate', function(){ closeViewer(true); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeViewer(); });
document.addEventListener('click', function(e){

});
function fmtTime(t){ if(!t) return ''; var d=new Date(Date.parse(t)+9*3600e3).toISOString(); return md(d.slice(0,10))+' '+d.slice(11,16); }

// ── 지난 대화로 타임라인 채우기: 웍스에서 내보낸 대화(.txt) → AI 미리보기 → 고른 줄만 저장 ──
var imp = {st:'', evs:[], on:{}, msg:''};
function importCard(){
  if(!imp.st) return '';
  var h='<div class="card imp"><div class="imp-b">';
  if(imp.st==='busy') return h+'<div class="s">읽는 중…</div></div></div>';
  if(!imp.evs.length) return h+'<div class="s">찾은 업무가 없습니다.</div><button class="link-btn" data-imp="reset">닫기</button></div></div>';
  var n=Object.keys(imp.on).filter(function(k){return imp.on[k];}).length;
  if(imp.msg) h+='<div class="s">'+esc(imp.msg)+'</div>';
  h+=imp.evs.map(function(e,i){
    return '<label class="imp-r"><input type="checkbox" data-impi="'+i+'"'+(imp.on[i]?' checked':'')+'><span class="d">'+md(e.date)+(e.time?' '+esc(e.time):'')+'</span><span>'+esc(e.summary)+(e.state==='예정'?' <small>(예정)</small>':'')+'</span></label>';
  }).join('');
  return h+'<div class="imp-a"><button class="open" data-imp="save"'+(n?'':' disabled')+'>'+n+'줄 넣기</button><button class="link-btn" data-imp="reset">취소</button></div></div></div>';
}
function impPreview(file){
  if(!file) return;
  if(file.size>1500000){ toast('파일이 너무 큽니다'); return; }
  var rd=new FileReader();
  rd.onload=function(){
    imp={st:'busy', evs:[], on:{}, msg:''}; tl.on=false; view='timeline'; render(); window.scrollTo(0,0);
    api({action:'chat_import_preview', lNum:data.lNum, text:String(rd.result||'')}).then(function(j){
      imp={st:'preview', evs:j.events||[], on:{}, msg:j.truncated?'파일이 길어 최근 대화만 읽었습니다':'', start:j.startDate||''};
      imp.evs.forEach(function(_,i){ imp.on[i]=true; });
      render();
    }).catch(function(e){ imp={st:'', evs:[], on:{}, msg:''}; render(); toast('읽지 못했습니다: '+((e&&e.message)||e)); });
  };
  rd.readAsText(file, 'utf-8');
}
function impSave(btn){
  var pick=imp.evs.filter(function(_,i){ return imp.on[i]; });
  btn.disabled=true; btn.textContent='넣는 중…';
  api({action:'chat_import_save', lNum:data.lNum, events:pick, startDate:imp.start||''}).then(function(j){
    imp={st:'', evs:[], on:{}, msg:''};
    return loadCase(ctx.key).then(function(d){ data=d; render(); toast(j.saved+'줄 넣었습니다'); });
  }).catch(function(e){ btn.disabled=false; btn.textContent='다시 넣기'; toast('넣지 못했습니다: '+((e&&e.message)||e)); });
}

// ── 타임라인 수정: 오른쪽 위 [수정]을 눌렀을 때만. 대화·직접 입력 줄을 고치기·삭제·되살리기·추가 ──
var tl = {on:false, rows:[], busy:false};
function tlOpen(){
  tl={on:true, rows:[], busy:true}; render();
  api({action:'tl_list', lNum:data.lNum}).then(function(j){
    tl.rows=(j.rows||[]).map(function(r){ return {id:r.id, d:r.d, tm:r.tm||'', t:r.t||'', hid:!!r.hid, o:JSON.stringify([r.d,r.tm||'',r.t||'',!!r.hid])}; });
    tl.busy=false; render();
  }).catch(function(e){ tl={on:false, rows:[], busy:false}; render(); toast('불러오지 못했습니다: '+((e&&e.message)||e)); });

function tlRead(){
  document.querySelectorAll('#main .tle').forEach(function(el){
    var r=tl.rows[Number(el.dataset.i)]; if(!r) return;
    r.d=el.querySelector('.tle-d').value; r.tm=el.querySelector('.tle-tm').value.trim(); r.t=el.querySelector('.tle-t').value.trim();
  });
}
function tlEditView(){
  if(tl.busy) return emptySt('불러오는 중…');
  var rows=tl.rows.map(function(r,i){
    return '<div class="tle'+(r.hid?' off':'')+'" data-i="'+i+'">'
      +'<input class="tle-d" type="date" value="'+esc(r.d)+'"'+(r.hid?' disabled':'')+'>'
      +'<input class="tle-tm" placeholder="시각" inputmode="numeric" value="'+esc(r.tm)+'"'+(r.hid?' disabled':'')+'>'
      +'<input class="tle-t" placeholder="내용" value="'+esc(r.t)+'"'+(r.hid?' disabled':'')+'>'
      +'<button class="link-btn" data-tlx="'+i+'">'+(r.hid?'되살리기':'삭제')+'</button></div>';
  }).join('');
  var files=tlFileRows();
  return '<div class="card tled">'+(files?files+'<div class="tlf-h">타임라인 줄</div>':'')+(rows||(files?'':'<div class="tle-h"><div class="s">고칠 줄이 없습니다</div></div>'))
    +'<div class="tle-a"><button class="link-btn" id="tladd">+ 줄 추가</button><button class="link-btn warn" id="tlreset">대화 기록 모두 지우기</button><span class="sp"></span><button class="link-btn" id="tlcancel">취소</button><button class="open" id="tlsave">저장</button></div></div>';
}
function tlSave(btn){
  tlRead();
  var ch=[];
  for(var i=0;i<tl.rows.length;i++){
    var r=tl.rows[i];
    if(!r.hid && (!/^\d{4}-\d{2}-\d{2}$/.test(r.d) || !r.t)){ toast('날짜와 내용을 채워 주세요'); return; }
    if(r.tm && !/^\d{1,2}:\d{2}$/.test(r.tm)){ toast('시각은 14:30처럼 써 주세요'); return; }
    if(r.tm.length===4) r.tm='0'+r.tm;
    if(!r.id && r.hid) continue;
    if(r.id && JSON.stringify([r.d,r.tm,r.t,r.hid])===r.o) continue;
    ch.push({id:r.id||null, date:r.d, time:r.tm, summary:r.t, hidden:r.hid});
  }
  var fc=tlFileChanges();
  if(!ch.length && !fc.length){ tl.on=false; render(); return; }
  btn.disabled=true; btn.textContent='저장 중…';
  var chain=Promise.resolve();
  fc.forEach(function(x){ chain=chain.then(function(){ return api({action:'set_file', lNum:data.lNum, lp:x.lp, id:x.id}); }); });
  chain.then(function(){ return ch.length ? api({action:'tl_save', lNum:data.lNum, rows:ch}) : {saved:0, failed:0}; }).then(function(j){
    tl.on=false;
    return loadCase(ctx.key).then(function(d){ data=d; render(); toast(j.failed?('저장 '+j.saved+'줄, 실패 '+j.failed+'줄'):'저장했습니다'); });
  }).catch(function(e){ btn.disabled=false; btn.textContent='저장'; toast('저장 실패: '+((e&&e.message)||e)); });
}
function tlReset(btn){
  if(btn.disabled) return;
  if(!btn.dataset.armed){ btn.dataset.armed='1'; btn.textContent='정말 지우기'; return; }
  btn.disabled=true; btn.textContent='지우는 중…';
  api({action:'chat_reset', lNum:data.lNum}).then(function(j){
    tl.on=false;
    return loadCase(ctx.key).then(function(d){ data=d; render(); toast(j.removed+'줄 지웠습니다'); });
  }).catch(function(e){ btn.disabled=false; delete btn.dataset.armed; btn.textContent='대화 기록 모두 지우기'; toast('지우지 못했습니다: '+((e&&e.message)||e)); });
}
function tlRefresh(btn){
  if(btn.disabled) return;
  btn.disabled=true; btn.textContent='갱신 중…';
  api({action:'tl_refresh', lNum:data.lNum}).then(function(j){
    return loadCase(ctx.key).then(function(d){ data=d; render(); toast(j.saved?(j.saved+'줄 추가'):'새 줄 없음'); });
  }).catch(function(e){ toast('갱신 실패: '+((e&&e.message)||e)); }).then(function(){ btn.disabled=false; btn.textContent='갱신'; });
}
document.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;

document.addEventListener('change', function(e){

function render(){
  document.querySelectorAll('#nav button').forEach(function(b){ b.setAttribute('aria-current', b.dataset.v===view?'page':'false'); });
  $('#nav').hidden=false;
  // 로웨어에 없는 자체 사건 중 수사기관 표시도 없는 방(민사·제목 못 읽음 등)은 '로웨어 미등록'으로
  var own = data.inv && data.court==='수사 단계', court = own ? '로웨어 미등록' : data.court;
  $('#title').textContent = data.dispNo || (own ? '로웨어 미등록' : (data.roomOnly || data.inv) ? '수사 단계' : data.caseNo);
  $('#sub').innerHTML = (q.get('closed') || data.closed ? '<span class="tag">종결</span>' : '') + [data.title, court].filter(Boolean).map(esc).join(' · ');
  $('#switch').hidden = !!ctx.room;
  // 한 방에 로웨어 사건이 둘 이상이면(제목에 사건번호 2개 등) 사건 탭
  var ct=ctx.tabs||[];
  $('#ctabs').hidden = ct.length<2;
  var mg=ctx.merge, isMg=function(c){ return !!mg && mg.merged.some(function(x){ return cnk(x)===cnk(c); }); };
  if(mg) ct=ct.slice().sort(function(a,b){ return (cnk(b)===cnk(mg.main))-(cnk(a)===cnk(mg.main)) || isMg(a)-isMg(b); });
  var LV=ctx.levels&&ctx.levels.length>1?ctx.levels:null;
  if(LV){ $('#ctabs').hidden=false; $('#ctabs').innerHTML=LV.slice().reverse().map(function(L,gi){ return (gi?'<span class="sep"></span>':'')+'<span class="gl">'+esc(L.label)+'</span>'+L.cases.map(function(c,i){ var m=L.merged.indexOf(c)>=0, mn=!m&&L.merged.length>0; return (m&&i?'<span class="lk">←</span>':'')+'<button data-ctab="'+esc(c)+'" aria-current="'+(cnk(c)===cnk(data.caseNo))+'">'+(m?'<i>병합</i>':mn?'<i>본</i>':'')+esc(c)+'</button>'; }).join(''); }).join(''); }
  else $('#ctabs').innerHTML = ct.length<2 ? '' : ct.map(function(c,i){ var m=isMg(c), mn=!!mg&&cnk(c)===cnk(mg.main); return (m&&i?'<span class="lk">←</span>':'')+'<button data-ctab="'+esc(c)+'" aria-current="'+(c===data.caseNo)+'">'+(m?'<i>병합</i>':mn?'<i>본</i>':'')+esc(c)+'</button>'; }).join('');
  var canTl = view==='timeline' && !!data.lNum;
  $('#impbtn').hidden = !canTl || tl.on; $('#tledit').hidden = !canTl || tl.on;
  $('#tlref').hidden = !canTl || tl.on || !(Number(data.lNum) < 0);
  $('#main').innerHTML = (VIEWS[view]||VIEWS.timeline)();
}
document.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ctab){ if(b.dataset.ctab===data.caseNo) return; if(editing && !confirmLeave()) return; editing=false; tl.on=false; sub.lv=null; showCase({'case':b.dataset.ctab}); return; }
  if(b.dataset.v){ if(editing && !confirmLeave()) return; editing=false; tl.on=false; view=b.dataset.v; render(); window.scrollTo(0,0); return; }
  ['f','scope','p','lv'].forEach(function(k){ if(b.dataset[k]){ sub[k]=b.dataset[k]; render(); } });
  if(b.dataset.edit){ editing=b.dataset.edit; render(); var c=$('#main .card.editing'); if(c){ var i=c.querySelector('input,textarea,select'); if(i) i.focus(); if(c.getBoundingClientRect().top<0) c.scrollIntoView({block:'start'}); } }
  if(b.id==='cancel'){ editing=false; render(); }
  if(b.id==='save') saveInfo(b);
  if(b.dataset.copy){ copyText(b.dataset.copy); }
  if(b.dataset.stg){ stOpen[b.dataset.stg]=!stOpen[b.dataset.stg]; render(); }
  if(b.dataset.file) openFile(b);
  if(b.dataset.imp==='reset'){ imp={st:'', evs:[], on:{}, msg:''}; render(); }
  if(b.dataset.imp==='save') impSave(b);
});
function parseXp(t){ try{ var a=JSON.parse(t||'[]'); return Array.isArray(a)?a.filter(function(x){ return x&&(x.p||x.n); }):[]; }catch(e){ return []; } }
function pvRow(defs, p){ p=p||{}; return '<div class="fr pv"><div class="pv-in" style="grid-column:1/4">'+defs.map(function(d){ return '<input data-pf="'+d[0]+'" placeholder="'+esc(d[1])+'" value="'+esc(p[d[0]]||'')+'"'+((d[2]||{}).tel?' inputmode="tel"':'')+'>'; }).join('')+'<button class="xp-del" type="button">삭제</button></div></div>'; }
function xpRow(x){ x=x||{}; return '<div class="fr xp"><div class="xp-in" style="grid-column:1/4"><input class="xp-n" placeholder="관계" value="'+esc(x.n||'')+'"><input class="xp-p" inputmode="tel" placeholder="전화번호" value="'+esc(x.p||'')+'"><button class="xp-del" type="button">삭제</button></div></div>'; }
document.addEventListener('click', function(e){

function confirmLeave(){ return window.confirm('저장하지 않은 수정이 있습니다. 나갈까요?'); }
// 이 방에 연결된 로웨어 사건번호(자체 사건이면 빈칸). 바꾸면 다른 사건으로 연결, 비우면 연결 해지
function linkOrig(){ return data.inv ? '' : String(data.caseNo||''); }
function relink(btn, no){
  btn.disabled=true; btn.textContent='바꾸는 중…';
  api({action:'relink_room', room:ctx.key.room, 'case':no}).then(function(){
    editing=false; return showCase(ctx.key).then(function(){ toast(no?'연결을 바꿨습니다':'연결을 풀었습니다'); });

function saveInfo(btn){
  var box=$('#main .card.editing'); if(!box) return;
  var ln=box.querySelector('#link-no');
  if(ln){ var no=ln.value.replace(/\s+/g,''); if(no!==linkOrig().replace(/\s+/g,'')) return relink(btn, no); }
  var fields={}; box.querySelectorAll('[data-k]').forEach(function(el){ fields[el.dataset.k]=el.value.trim(); });
  if(box.querySelector('#xp')){
    var xp=[]; box.querySelectorAll('.xp').forEach(function(r){ var n=r.querySelector('.xp-n').value.trim(), p=r.querySelector('.xp-p').value.trim(); if(n||p) xp.push({n:n,p:p}); });
    fields.extra_phones = xp.length ? JSON.stringify(xp) : '';
  }
  var body={action:'save_info', lNum:data.lNum, fields:fields};
  if(data.stages){
    var st={}; box.querySelectorAll('[data-sk]').forEach(function(el){ var p=el.dataset.sk.split('.'); (st[p[0]]=st[p[0]]||{})[p[1]]=el.value.trim(); });
    box.querySelectorAll('.pvbox').forEach(function(pb){ var k=pb.dataset.st, list=[];
      pb.querySelectorAll('.pv').forEach(function(r){ var o={}, any=false; r.querySelectorAll('[data-pf]').forEach(function(el){ o[el.dataset.pf]=el.value.trim(); if(o[el.dataset.pf]) any=true; }); if(any) list.push(o); });
      (st[k]=st[k]||{}).prev=list; });
    var sc=box.querySelector('#st-cur'), ss=box.querySelector('#st-start');
    if(Object.keys(st).length || sc){ body.stages=st; body.cur=sc?sc.value:data.stages.cur; body.start=ss?ss.value:data.stages.start; }
  }
  btn.disabled=true; btn.textContent='저장 중…';
  api(body).then(function(j){
    data.info={fields:j.fields, saved:true, updatedBy:j.updatedBy, updatedAt:j.updatedAt, linked:data.info.linked};
    if(j.stages){ data.stages=j.stages; data.dispNo=j.dispNo; }
    editing=false; render(); toast('저장했습니다');
  }).catch(function(e){ btn.disabled=false; btn.textContent='저장'; toast('저장 실패: '+((e&&e.message)||e)); });
}

// 최근 고른 사건 5개 (이 브라우저에만 저장)
function getRecent(){ try{ return JSON.parse(localStorage.getItem('jeongseo.recentCases')||'[]'); }catch(e){ return []; } }
function addRecent(c){ try{ var r=getRecent().filter(function(x){return x!==c;}); r.unshift(c); localStorage.setItem('jeongseo.recentCases', JSON.stringify(r.slice(0,5))); }catch(e){} }

// ── 사건 고르기 ───────────────────────────────────────
function showPicker(subText){
  $('#nav').hidden=true; $('#switch').hidden=true;
  $('#title').textContent='사건 고르기';
  $('#sub').textContent=subText||'내 담당 사건';
  $('#main').innerHTML='<input class="search" id="qs" placeholder="사건번호나 사건명으로 찾기"><div class="card" id="list"><div class="empty-st">불러오는 중…</div></div>';
  return loadMyCases().then(function(list){
    var recent=getRecent();
    function draw(qs){
      var rows=list.filter(function(x){ return !qs || (x.c+x.t).indexOf(qs)>=0; });
      if(!qs) rows.sort(function(a,b){ var i=recent.indexOf(a.c), j=recent.indexOf(b.c); return (i<0?99:i)-(j<0?99:j); });
      $('#list').innerHTML=rows.map(function(x){
        return '<button class="pick" data-case="'+esc(x.c)+'"><span class="casechip">'+esc(x.c)+'</span>'+esc(x.t)+'<span class="s">'+esc(x.next)+'</span></button>';
      }).join('') || emptySt('맞는 사건이 없습니다');
    }
    $('#qs').oninput=function(){ draw(this.value.trim()); };
    draw('');
  }).catch(function(e){ $('#list').innerHTML=emptySt('불러오지 못했습니다', esc((e&&e.message)||e)); });
}
document.addEventListener('click', function(e){

  ctx.caseParam=b.dataset.case; addRecent(ctx.caseParam); editing=false;
  // PC에서 방을 못 찾은 경우: 고른 사건을 그때 읽은 방 제목과 함께 기억 → 다음부터 바로 열림
  if(ctx.locatePick){
    var lid=ctx.locatePick; ctx.locatePick=null;
    api({action:'remember_pick', locate:lid, 'case':ctx.caseParam}).then(function(r){ if(r&&r.saved) toast('이 방을 기억했습니다. 다음부터 바로 열립니다'); }, function(){});
  }
  // 연결 안 된 방에서 고르면 그 방에 기억해 두고(다음부터 바로 열림) 방 기준으로 연다
  if(ctx.unpairedRoom){
    var room=ctx.unpairedRoom; ctx.unpairedRoom='';
    $('#sub').textContent='이 방에 연결하는 중…';
    return api({action:'link_room', room:room, 'case':ctx.caseParam})
      .then(function(r){ if(r.linked) toast('이 방에 사건을 연결했습니다'); return showCase(r.linked ? {room:room} : {'case':ctx.caseParam}); }, function(){ return showCase({'case':ctx.caseParam}); })
      .then(function(){ window.scrollTo(0,0); });
  }
  showCase({'case':ctx.caseParam}).then(function(){ window.scrollTo(0,0); });
});

// ── 사건 하나 열기 ────────────────────────────────────
function message(title, subText, body){
  $('#nav').hidden=true; $('#switch').hidden=true;
  $('#title').textContent=title; $('#sub').textContent=subText||'';
  $('#main').innerHTML=body||'';
}
function showHold(){ message('사건 미확정','', emptySt('이 방의 사건이 아직 정해지지 않았습니다')); }
function showCase(key){
  ctx.key=key;
  $('#sub').textContent='불러오는 중…';
  return loadCase(key).then(function(d){ return showCaseData(key, d); }).catch(function(e){
    message('불러오지 못함', '', emptySt('잠시 뒤 다시 열어 주세요', esc((e&&e.message)||e)));
  });
}
function showCaseData(key, d){
  ctx.key=key;
  return Promise.resolve().then(function(){
    if(d.hold) return showHold();
    if(d.unpaired){ ctx.unpairedRoom=key.room||''; return showPicker('이 방과 연결된 사건이 없습니다 · 고르면 이 방에 기억됩니다'); }
    if(d.notfound) return message('사건을 찾지 못함', d.caseNo||'', emptySt('로웨어에 없는 사건번호입니다'));
    if(key.room && d.caseNo) ctx.merge=(d.info&&d.info.merge)||null;
    if(key.room && d.caseNo) ctx.levels=d.levels||null;
    if(key.room && d.caseNo) ctx.tabs=[d.caseNo].concat((d.info&&d.info.linked)||[]).filter(function(c,i,a){ return c && a.indexOf(c)===i; });
    data=d; render();
  }).catch(function(e){
    message('불러오지 못함', '', emptySt('잠시 뒤 다시 열어 주세요', esc((e&&e.message)||e)));
  });
}

// ── PC: 지금 보고 있는 웍스 방 찾기 ───────────────────
function showLocate(){
  message('사건 정보', '보고 있는 웍스 방을 확인하는 중…', '<div class="empty-st">잠시만 기다려 주세요</div>');
  return api({action:'locate', open:1}).then(function(j){
    if(j.located){
      var L=j.located; if(L.room) ctx.room=L.room; else ctx.caseParam=L['case'];
      return showCaseData(L.room ? {room:L.room} : {'case':L['case']}, j);
    }
    if(j.room){ ctx.room=j.room; return showCase({room:j.room}); }
    if(j['case']){ ctx.caseParam=j['case']; return showCase({'case':j['case']}); }
    if(j.nohelper) return showPicker('PC 도우미가 켜져 있지 않아 방을 알 수 없습니다');
    if(j.timeout) return showPicker('PC 도우미가 응답하지 않습니다 (업데이트가 필요할 수 있어요)');
    if(j.locate){ ctx.locatePick=j.locate; return showPicker('이 방을 찾지 못했습니다 · 사건을 한 번 고르면 다음부터 바로 열립니다'); }
    return showPicker('웍스 창에서 방 이름을 읽지 못했습니다 (창을 최소화하지 마세요)');
  }).catch(function(){ return showPicker(''); });
}

// ── PC 도우미 연결 (?setup=pc) ────────────────────────
var GET_CMD = 'mkdir %TEMP%\\jshelper & cd /d %TEMP%\\jshelper & (for %f in (jeongseo-helper.ps1 install.ps1 install.cmd uninstall.ps1 uninstall.cmd server.json version.txt) do @curl -sSLO https://raw.githubusercontent.com/ukwon-ganada/jeongseo/main/tools/pc-helper/%f) & install.cmd';
function showSetup(){
  $('#nav').hidden=true; $('#switch').hidden=true;
  $('#title').textContent='PC 도우미 연결';
  $('#sub').textContent='PC 웍스 사건방 메뉴를 누르면 그 방 사건이 바로 열리게 하려면, 이 PC에 한 번만 하면 됩니다.';
  $('#main').innerHTML='<div class="card setup"><ol>'+
    '<li>윈도우 시작 버튼 → <b>cmd</b> 입력 → <b>명령 프롬프트</b>를 엽니다.</li>'+
    '<li>아래 버튼으로 설치 명령을 받아 복사한 뒤, 명령 프롬프트에 붙여 넣고 Enter를 누릅니다.<div id="tokbox"><button class="primary" id="mktok" style="margin-top:8px">설치 명령 받기</button></div></li>'+
    '<li>“설치 끝”이 나오면 완료입니다. 이제 PC 웍스 사건방 ≡ 메뉴(타임라인·기한·기일·나의사건·사건정보)를 누르면 그 방 사건이 바로 열립니다. 웍스 창은 최소화하지 마세요.</li>'+
    '</ol></div><div class="foot">설치 명령에는 이 PC 연결 코드가 들어 있어 한 번만 보입니다. 메신저나 채팅에 붙이지 마세요.</div>';
}
function copyText(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('복사했습니다'); }).catch(function(){ toast('글자를 길게 눌러 직접 복사해 주세요'); }); }
document.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy) copyText($('#'+b.dataset.copy).textContent);
  if(b.id==='mktok'){
    b.disabled=true; b.textContent='만드는 중…';
    api({action:'helper_token'}).then(function(j){
      // 연결 코드를 넣은 한 줄: 받아서 설치(최신 도우미·지킴이·자동 업데이트)까지 한 번에
      var cmd = GET_CMD + (/^[0-9a-f]{48}$/.test(String(j.token||'')) ? ' ' + j.token : '');
      $('#tokbox').innerHTML='<button class="code" id="cmd">'+esc(cmd)+'</button><button class="copy" data-copy="cmd">명령 복사</button>';
    }).catch(function(err){ b.disabled=false; b.textContent='설치 명령 받기'; toast('실패: '+((err&&err.message)||err)); });
  }
});

// ── WOFF 시작 ─────────────────────────────────────────
function start(){
  woff.init({woffId: WOFF_ID}).then(function(){
    // ?relogin=1: 권한이 바뀌었을 때 새 토큰을 받도록 로그아웃 후 다시 로그인
    if(q.get('relogin') && woff.isLoggedIn()){ try{ woff.logout(); }catch(e){} }
    if(!woff.isLoggedIn()){
      message('사건 정보','', '<div class="empty-st"><b>웍스 계정으로 로그인해 주세요</b><div style="margin-top:16px"><button class="primary" id="lg">로그인</button></div></div>');
      $('#lg').onclick=function(){ woff.login({redirectUri: location.href.replace(/[?&]relogin=1/,'')}); };
      return;
    }
    try{ ctx.tok = woff.getAccessToken ? woff.getAccessToken() : ''; }catch(e){}
    var inClient = woff.isInClient();
    var pRoom = inClient && woff.getChannelId ? Promise.resolve().then(function(){ return woff.getChannelId(); }).then(function(c){ ctx.room = c || ''; }).catch(function(){}) : Promise.resolve();
    return pRoom.then(function(){
      // 보류 방: 어느 사건인지 확정 못 함 → 사건정보·서면을 띄우지 않는다
      if(q.get('hold')) return showHold();
      if(q.get('setup')==='pc') return showSetup();
      // PC(바깥 브라우저): 웍스가 방을 알려 주지 않으므로, 이 PC 도우미가 웍스 창의 방 제목을 읽어 찾는다
      if(!inClient && !ctx.room && !ctx.caseParam && !q.get('room')) return showLocate();
      if(!ctx.room && !ctx.caseParam) return showPicker(q.get('room') ? '이 방과 연결된 사건이 없습니다' : '');
      return showCase(ctx.room ? {room:ctx.room} : {'case':ctx.caseParam});
    });
  }).catch(function(e){
    message('열 수 없음','', emptySt('네이버웍스 앱에서 열어 주세요', esc((e&&e.message)||e)));
  });
}
var s=document.createElement('script'); s.src=SDK; s.onload=start;
s.onerror=function(){ message('열 수 없음','', emptySt('네이버웍스 연결에 실패했습니다','잠시 뒤 다시 열어 주세요.')); };
document.head.appendChild(s);
</script>
</body>
